// 본체의 입구. 수업 레포 spring-cloud/gateway 에서 인증과 HTTPS를 뺀 것
apply plugin: 'org.springframework.boot'

// Dockerfile이 build/libs/*.jar 하나만 집도록 일반 jar는 만들지 않는다 (수업 레포와 같음)
jar {
    enabled = false
}

ext {
    springCloudVersion = '2025.1.4'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'   // 헬스 모음이 하위 서비스 헬스를 부를 때 (수업 레포와 같음)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'           // 분산 추적
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// bootRun · test 작업 폴더 = 이 모듈 폴더. 설정은 ../../config-repo 에서 읽는다 (compose에서는 /config-repo)
