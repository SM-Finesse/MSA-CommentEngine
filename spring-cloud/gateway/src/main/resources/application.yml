# 설정 본문은 config-repo에 있다 (수업 12장의 폴더 구조, Config Server는 없음).
# 칩이 들고 오는 경로·헬스(chips/<칩>/gateway.yml)도 같이 읽는다. 칩이 없으면 본체 경로만 남는다.
# 로컬 실행: 작업 폴더가 이 모듈 폴더라서 ../../config-repo 와 ../../chips 를 읽는다.
# compose: SPRING_CONFIG_LOCATION으로 같은 파일들을 직접 지정하므로 이 파일은 쓰이지 않는다.
spring:
  config:
    import:
      - file:${CONFIG_DIR:../../config-repo}/application.yml
      - file:${CONFIG_DIR:../../config-repo}/gateway.yml
      - optional:file:${CHIPS_DIR:../../chips}/*/gateway.yml
