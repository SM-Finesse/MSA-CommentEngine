// 슬롯 모듈 — finesse-api와 comment-engine이 함께 보는 "주문서 양식".
// 스프링 부트 앱이 아니라 라이브러리. 이 모듈에는 분야(도메인) 단어가 없어야 한다(NoDomainWordsTest).
plugins {
    id 'java-library'
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    api 'org.springframework:spring-web'              // 인터페이스의 @PostMapping 등
    api 'jakarta.validation:jakarta.validation-api'   // 요청 검증 규칙
    api 'tools.jackson.core:jackson-databind'         // snake_case 이름 규칙, 팩 파일 읽기

    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
