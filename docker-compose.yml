# 본체만 있다: gateway, comment-engine, 추적 화면(zipkin). 칩의 서비스는 여기에 없다.
#
#   gateway ─── /v1/** → comment-engine → 칩의 생성 서버
#      └─────── 칩이 들고 온 경로 (chips/<칩>/gateway.yml) → 칩의 서비스
#
# 칩은 chips/<칩>/ 폴더 하나다. 팩(pack/)만 있는 칩은 폴더를 두기만 하면 엔진이 읽는다.
# 자기 서비스가 있는 칩은 chips/<칩>/compose.yml 을 들고 오고, .env 의 COMPOSE_FILE 목록에 한 줄 더한다.
# 그래서 아래 명령은 본체와 꽂힌 칩을 같이 띄운다 (.env 를 읽는다):
#
#   ./gradlew build -x test
#   docker compose up -d --build
#   curl http://localhost:8080/v1/domains
#
# 밖으로 여는 포트는 gateway의 8080, 추적 화면(Zipkin)의 9411, 서비스 선택 화면의 8090이다.

x-healthcheck: &healthcheck
  # eclipse-temurin:25-jre 에는 wget · curl 이 없어 bash 의 /dev/tcp 로 관리 포트(4004)를 부른다
  # readiness 는 "이 서비스가 요청을 받을 준비가 됐나"만 본다. 다른 서비스가 죽어도 이 컨테이너는 정상
  test:
    - CMD
    - bash
    - -c
    - >-
      exec 3<>/dev/tcp/localhost/4004 &&
      printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
      grep -q '"status":"UP"' <&3
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  gateway:
    build: spring-cloud/gateway
    image: msa-comment-engine/gateway
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # 본체 설정 두 개 + 칩이 들고 온 경로·헬스 (칩마다 chips/<칩>/gateway.yml, 없으면 건너뜀)
      - SPRING_CONFIG_LOCATION=file:/config-repo/application.yml,file:/config-repo/gateway.yml,optional:file:/chips/*/gateway.yml
    volumes:
      - ./config-repo:/config-repo:ro
      - ./chips:/chips:ro
    ports:
      - "8080:8080"
    healthcheck: *healthcheck
    depends_on:
      comment-engine:
        condition: service_healthy
      zipkin:
        condition: service_started

  comment-engine:
    build: microservices/comment-engine
    image: msa-comment-engine/comment-engine
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-repo/application.yml,file:/config-repo/comment-engine.yml
    volumes:
      - ./config-repo:/config-repo:ro
      - ./chips:/chips:ro     # 칩은 이미지에 굽지 않고 꽂는다. 엔진은 칩마다 /chips/<칩>/pack/ 만 읽는다
    healthcheck: *healthcheck
    depends_on:
      zipkin:
        condition: service_started

  # 엔진 첫 화면: 서비스(칩) 선택 화면 (commentengine-select/, 빌드 없는 정적 파일)
  # 칩 목록·주소는 commentengine-select/config.json. 폴더를 그대로 꽂으므로 파일만 고치고 새로고침하면 반영된다
  select-screen:
    image: nginx:1.27-alpine
    mem_limit: 64m
    volumes:
      - ./commentengine-select:/usr/share/nginx/html:ro
    ports:
      - "${ENGINE_SELECT_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/config.json"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 추적 화면. gateway → 칩의 서비스 → comment-engine 요청이 한 줄로 이어져 보인다
  zipkin:
    image: openzipkin/zipkin:3.5.0
    mem_limit: 1024m
    environment:
      - STORAGE_TYPE=mem
    ports:
      - "9411:9411"
