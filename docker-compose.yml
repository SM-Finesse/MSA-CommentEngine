# 본체와 칩 쪽 서비스를 한 번에 띄운다
#   gateway ─┬─ /v1/**  → comment-engine → 생성 서버(small-gen)
#            └─ /api/** → finesse-api → comment-engine
#
#   ./gradlew build -x test
#   docker compose up -d --build
#   curl http://localhost:8080/v1/domains
#
# 밖으로 여는 포트는 gateway의 8080과 추적 화면(Zipkin)의 9411이다.

x-healthcheck: &healthcheck
  # eclipse-temurin:25-jre 에는 wget · curl 이 없어 bash 의 /dev/tcp 로 관리 포트(4004)를 부른다
  # readiness 는 "이 서비스가 요청을 받을 준비가 됐나"만 본다. 엔진이 죽어 finesse-api 의 회로가 열려도 finesse-api 컨테이너는 정상
  test:
    - CMD
    - bash
    - -c
    - >-
      exec 3<>/dev/tcp/localhost/4004 &&
      printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
      grep -q '"status":"UP"' <&3
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  gateway:
    build: spring-cloud/gateway
    image: msa-comment-engine/gateway
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-repo/application.yml,file:/config-repo/gateway.yml
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8080:8080"
    healthcheck: *healthcheck
    depends_on:
      comment-engine:
        condition: service_healthy
      finesse-api:
        condition: service_healthy
      zipkin:
        condition: service_started

  comment-engine:
    build: microservices/comment-engine
    image: msa-comment-engine/comment-engine
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-repo/application.yml,file:/config-repo/comment-engine.yml
      # tetris 칩의 생성 서버 주소. 실제 llm-server로 바꾸려면 이 줄만 고친다 (쉼표로 여러 대)
      - FINESSE_PACK_TETRIS_SERVERS=http://small-gen:9200
    volumes:
      - ./config-repo:/config-repo:ro
      - ./domain-packs:/packs:ro     # 칩은 이미지에 굽지 않고 꽂는다
    healthcheck: *healthcheck
    depends_on:
      zipkin:
        condition: service_started

  # 칩 쪽 조합 서비스 (tetris 칩). 화면이 부르는 API로, gateway의 /api/** 가 여기로 온다
  finesse-api:
    build: microservices/finesse-api
    image: msa-comment-engine/finesse-api
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-repo/application.yml,file:/config-repo/finesse-api.yml
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck: *healthcheck
    depends_on:
      comment-engine:
        condition: service_healthy
      zipkin:
        condition: service_started

  # tetris 칩의 분석 서비스 (모놀리식 calc·통계를 옮김). TETR.IO에서 전적을 받아 지표를 계산한다
  # gateway에는 열지 않는다. finesse-api가 안쪽에서 부른다 (다음 단계)
  tetris-analytics:
    build: microservices/tetris-analytics
    image: msa-comment-engine/tetris-analytics
    mem_limit: 768m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-repo/application.yml,file:/config-repo/tetris-analytics.yml
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck: *healthcheck
    depends_on:
      zipkin:
        condition: service_started

  # 추적 화면. gateway → finesse-api → comment-engine 요청이 한 줄로 이어져 보인다
  zipkin:
    image: openzipkin/zipkin:3.5.0
    mem_limit: 1024m
    environment:
      - STORAGE_TYPE=mem
    ports:
      - "9411:9411"

  # 시연용 작은 생성 서버. tetris 칩의 llm-server 자리
  small-gen:
    image: eclipse-temurin:25-jdk
    mem_limit: 256m
    command: ["java", "/app/SmallGenServer.java", "9200"]
    volumes:
      - ./small-gen:/app:ro
