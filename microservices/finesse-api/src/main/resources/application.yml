server:
  port: 8092

spring:
  application:
    name: finesse-api
  jackson:
    property-naming-strategy: SNAKE_CASE      # 백엔드와 같은 응답 표기
    default-property-inclusion: non_null

engine:
  base-url: ${ENGINE_BASE_URL:http://localhost:7001}

app:
  endpoint:
    light-seconds: 40     # 백엔드 app.endpoint.light-seconds — 남은 시간을 deadline_ms로 넘긴다
