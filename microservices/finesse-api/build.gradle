// 칩 쪽 조합 서비스 — 지금 백엔드 CommentService 자리. 엔진 계약으로 comment-engine을 부른다.
apply plugin: 'org.springframework.boot'

// Dockerfile이 build/libs/*.jar 하나만 집도록 일반 jar는 만들지 않는다 (수업 레포와 같음)
jar {
    enabled = false
}

ext {
    resilience4jVersion = '2.4.0'   // 11/10 버전 시험에서 정한 값
}

dependencies {
    implementation project(':api')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // 헬스체크 (/actuator/health)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'           // 분산 추적
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'
    // finesse-api → 엔진 구간의 다시 시도 · 회로 차단기 (수업 13장과 같은 애너테이션 방식)
    implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'   // @Retry · @CircuitBreaker 가 쓰는 AOP
    // light 코멘트 캐시 (모놀리식 CacheConfig와 같은 Caffeine) · 캐시를 만드는 스레드로 추적 문맥 넘기기
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'io.micrometer:context-propagation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
