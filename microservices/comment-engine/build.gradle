apply plugin: 'org.springframework.boot'

// Dockerfile이 build/libs/*.jar 하나만 집도록 일반 jar는 만들지 않는다 (수업 레포와 같음)
jar {
    enabled = false
}

dependencies {
    implementation project(':api')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // 헬스체크 (/actuator/health)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'           // 분산 추적
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// bootRun 작업 폴더 = 이 모듈 폴더. 칩은 ../../chips 에서 읽는다 (compose에서는 /chips)
