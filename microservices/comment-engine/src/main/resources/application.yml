server:
  port: 7001

spring:
  application:
    name: comment-engine
  jackson:
    property-naming-strategy: SNAKE_CASE   # JSON은 전부 snake_case (확정안 3.3절)

engine:
  packs-dir: ${PACKS_DIR:../../domain-packs}   # compose에서는 /packs (./domain-packs:/packs:ro)
  call-timeout-ms: 10000    # 생성 서버 1회 호출 타임아웃
  exclude-seconds: 30       # 연결 실패 서버 제외 시간
  max-attempts: 3

# 로컬에서는 Zipkin이 없으므로 추적 기록을 만들지 않는다. compose에서는 config-repo의 docker 프로필이 1.0으로 덮어쓴다
management:
  tracing:
    sampling:
      probability: 0.0

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-18logger{0} %msg%n"
