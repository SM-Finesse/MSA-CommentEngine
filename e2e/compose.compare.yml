# compare-monolith 워크플로에서만 쓰는 덮어쓰기: tetris-analytics가 실제 TETR.IO 대신 러너의 기록·재생 프록시를 부른다
#   docker compose -f docker-compose.yml -f chips/tetris/compose.yml -f e2e/compose.compare.yml up -d
# 설정 키(tetrio.base-url, finesse.analytics.collector.base-url)는 SPRING_APPLICATION_JSON으로 덮는다
# (옮긴 설정 파일 tetris-analytics.yml은 그대로 둔다)
services:
  tetris-analytics:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - 'SPRING_APPLICATION_JSON={"tetrio":{"base-url":"http://host.docker.internal:9500/api"},"finesse":{"analytics":{"collector":{"base-url":"http://host.docker.internal:9500/api"}}}}'
  # light 비교: CI에는 LLM 서버가 없어 모놀리식은 대체 문장 틀을 쓴다. MSA도 같은 조건이 되게 tetris 칩의 생성 서버를
  # 닿지 않는 주소로 바꿔 칩의 대체 문장(phrases)이 나오게 한다 (small-gen 문장과 비교하지 않도록)
  comment-engine:
    environment:
      - FINESSE_PACK_TETRIS_SERVERS=http://127.0.0.1:9
