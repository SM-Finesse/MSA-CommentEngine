plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'msa-comment-engine'

include 'api'                          // 슬롯: 약속 3개 (엔진 계약 · 팩 규격 · 생성 서버 규약)
include 'microservices:comment-engine' // 본체
include 'microservices:finesse-api'    // 칩 쪽 조합 서비스 (엔진 계약으로 본체를 부른다)
