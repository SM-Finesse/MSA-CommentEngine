# finesse-api (칩 쪽 조합 서비스) 설정
server:
  port: 8092

spring:
  application:
    name: finesse-api
  jackson:
    property-naming-strategy: SNAKE_CASE      # 백엔드와 같은 응답 표기
    default-property-inclusion: non_null

engine:
  base-url: ${ENGINE_BASE_URL:http://localhost:7001}   # 엔진 주소
  # 시간 제한. 수업은 @TimeLimiter를 쓰지만 finesse-api는 WebMVC(동기)라 호출 타임아웃으로 대신한다
  connect-timeout-ms: 3000
  read-timeout-ms: 45000    # light 마감(40초)보다 조금 길게. 엔진이 마감 안에 답하지 않을 때의 안전망

app:
  endpoint:
    light-seconds: 40     # 백엔드 app.endpoint.light-seconds — 남은 시간을 deadline_ms로 넘긴다

# finesse-api → 엔진 구간의 다시 시도와 회로 차단기 (수업 13장 config-repo/product-composite.yml 과 같은 방식)
resilience4j:
  retry:
    instances:
      engine:
        max-attempts: 2          # 처음 1번 + 다시 1번
        wait-duration: 1s
        retry-exceptions:        # 엔진 자체에 닿지 않을 때만. 엔진이 에러로 답한 것(503 등)은 다시 부르지 않는다
          - com.finesse.composite.EngineUnreachableException
  circuitbreaker:
    instances:
      engine:
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:       # 엔진에 닿지 않은 것만 실패로 센다. 엔진이 에러로 답했다면 엔진은 살아 있다
          - com.finesse.composite.EngineUnreachableException

management:
  health:
    circuitbreakers:
      enabled: true    # /actuator/health 에 회로 상태(CLOSED · OPEN · HALF_OPEN)를 보여 준다

---
spring.config.activate.on-profile: docker

engine.base-url: http://comment-engine:7001
