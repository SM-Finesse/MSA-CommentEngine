# 모든 서비스가 같이 읽는 설정 (수업 config-repo/application.yml 에서 rabbitmq · kafka · auth-server 를 뺀 것)

management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "health,info"

# 분산 추적. 로컬에서는 Zipkin이 없으므로 기록을 만들지 않는다 (docker 프로필에서 켠다)
management.tracing.sampling.probability: 0.0

server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 10s

---
spring.config.activate.on-profile: docker

# 컨테이너 안에서는 관리 포트를 서비스 포트와 나눈다. 헬스체크는 :4004/actuator/health
# (로컬에서는 여러 서비스를 한 PC에 띄우므로 나누지 않는다. 서비스 포트의 /actuator/health)
management.server.port: 4004

# 요청을 전부 추적해 Zipkin으로 보낸다. 화면은 http://localhost:9411
management.tracing.sampling.probability: 1.0
management.tracing.export.zipkin.endpoint: http://zipkin:9411/api/v2/spans
