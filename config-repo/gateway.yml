server.port: 8080
spring.application.name: gateway

# 넘길 곳의 주소. 포트가 바뀌면 이 줄만 고친다
app.engine-url: http://localhost:7001

# 서비스 이름의 IP를 기억하는 최대 시간(초). Docker DNS는 600초를 알려 주는데, 그대로 따르면
# 엔진 컨테이너가 새 IP로 다시 뜬 뒤 최대 10분 동안 옛 IP로 보내 500이 난다 (DnsCacheConfiguration)
app.dns-cache-seconds: 5

# gateway 헬스(/actuator/health)에 함께 보여 줄 하위 서비스의 헬스 주소 (HealthCheckConfiguration)
# 여기에는 본체만 적는다. 칩의 서비스는 칩이 자기 폴더의 gateway.yml 에 적어 온다 (app.health.<이름>)
app.health:
  comment-engine: ${app.engine-url}/actuator/health

# 칩의 경로는 여기에 없다. 칩이 chips/<칩>/gateway.yml 의 app.routes.<이름> 으로 들고 온다 (ChipRoutesConfiguration)
spring.cloud.gateway.server.webflux:
  httpclient:
    connect-timeout: 3000
    response-timeout: 60s      # 칩 API의 응답 제한보다 길게
  routes:

  # 본체 기본 경로: api 모듈 CommentEngineService 의 3개
  - id: comment-engine
    uri: ${app.engine-url}
    predicates:
    - Path=/v1/comments/**,/v1/domains

---
spring.config.activate.on-profile: docker

app.engine-url: http://comment-engine:7001

# 컨테이너 안에서는 헬스가 관리 포트(4004)에 있다
app.health:
  comment-engine: http://comment-engine:4004/actuator/health
