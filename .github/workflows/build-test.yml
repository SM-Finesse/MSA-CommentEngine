name: build-test

# 슬롯(api) · 본체(comment-engine, gateway) · 칩 쪽 서비스(finesse-api)의 빌드와 시험. PR과 main 푸시에서 돈다.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: test
        run: bash ./gradlew test --console=plain

      - name: 시험 수 세기
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fail = 0
          for f in sorted(glob.glob('**/build/test-results/test/*.xml', recursive=True)):
              r = ET.parse(f).getroot()
              t, b = int(r.get('tests')), int(r.get('failures')) + int(r.get('errors'))
              total += t; fail += b
              print(f"{r.get('name')}: tests={t} failed={b} skipped={r.get('skipped')}")
          print(f"TOTAL tests={total} failed={fail}")
          # 실패한 시험의 메시지를 그대로 보여 준다 (보고서 파일을 열지 않아도 원인이 보이게)
          for f in sorted(glob.glob('**/build/test-results/test/*.xml', recursive=True)):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or '').strip().replace('\n', ' | ')
                      print(f"FAILED {case.get('classname')} > {case.get('name')}: {msg[:600]}")
                  # 다시 돌려서 통과한 시험 (build.gradle의 test-retry 설정) — 통과로 치지만 숨기지 않는다
                  flaky = list(case.findall('flakyFailure')) + list(case.findall('flakyError'))
                  if flaky:
                      msg = (flaky[0].get('message') or '').strip().replace('\n', ' | ')
                      print(f"FLAKY {case.get('classname')} > {case.get('name')}: {len(flaky)}번 실패 후 통과: {msg[:300]}")
          PY

      - name: 시험 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

  compose:
    # jar를 만들고 docker compose로 본체를 띄운 뒤 gateway(8080)를 거쳐 불러 본다
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: jar 만들기
        run: bash ./gradlew build -x test --console=plain

      - name: 띄우기
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: gateway 경유 호출
        run: |
          set -e
          call() { echo "== $1"; shift; curl -sS -f -w '\n[HTTP %{http_code}]\n' "$@"; }
          call "팩 목록" http://localhost:8080/v1/domains | tee /tmp/domains.txt
          grep -q '"id":"demo"' /tmp/domains.txt
          grep -q '"id":"tetris"' /tmp/domains.txt
          call "demo 칩 (template)" -H 'Content-Type: application/json' http://localhost:8080/v1/comments/light \
            -d '{"domain":"demo","items":[{"metric":"metric_a","value":0.31,"zone":"high"}],"deadline_ms":35000}' | tee /tmp/demo.txt
          grep -q '"fallback":false' /tmp/demo.txt
          call "tetris 칩 (server, small-gen)" -H 'Content-Type: application/json' http://localhost:8080/v1/comments/light \
            -d '{"domain":"tetris","items":[{"metric":"delta_app","value":0.05,"zone":"high"}],"deadline_ms":35000}' | tee /tmp/tetris.txt
          grep -q 'small-gen' /tmp/tetris.txt
          call "finesse-api 경유 demo 칩" -H 'Content-Type: application/json' http://localhost:8080/api/v1/comment-demo/light \
            -d '{"domain":"demo","highlights":[{"stat":"metric_a","value":0.31,"zone":"high"}]}' | tee /tmp/api-demo.txt
          grep -q '"light_summary":"A가 높습니다."' /tmp/api-demo.txt
          call "finesse-api 경유 tetris 칩" -H 'Content-Type: application/json' http://localhost:8080/api/v1/comment-demo/light \
            -d '{"domain":"tetris","highlights":[{"stat":"delta_app","value":0.05,"zone":"high"}]}' | tee /tmp/api-tetris.txt
          grep -q 'small-gen:9200' /tmp/api-tetris.txt
          echo "== 규칙 밖 경로는 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = "404"

      - name: 추적 확인 (Zipkin)
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request
          # 경로마다 한 추적에 이 서비스들만 정확히 나와야 한다
          want = {
              "gateway → comment-engine": {"gateway", "comment-engine"},
              "gateway → finesse-api → comment-engine": {"gateway", "finesse-api", "comment-engine"},
          }
          found, last = {}, None
          for _ in range(20):
              try:
                  traces = json.load(urllib.request.urlopen("http://localhost:9411/api/v2/traces?serviceName=gateway&limit=100"))
              except Exception as e:
                  traces, last = [], e
              for t in traces:
                  names = {s.get("localEndpoint", {}).get("serviceName") for s in t} - {None}
                  for label, services in want.items():
                      if label not in found and names == services:
                          found[label] = f"trace {t[0]['traceId']} spans={len(t)}"
              if len(found) == len(want):
                  for label in want:
                      print(f"OK: {label}: {found[label]}")
                  sys.exit(0)
              time.sleep(3)
          print("추적에 안 나온 경로:", [label for label in want if label not in found], last)
          print(urllib.request.urlopen("http://localhost:9411/api/v2/services").read().decode())
          sys.exit(1)
          PY

      - name: gateway 헬스에 하위 서비스 상태
        run: bash e2e/gateway-health.sh

      - name: 칩 꽂기·뽑기 (본체 5단계)
        run: bash e2e/plug-test.sh

      - name: 엔진 IP가 바뀌어도 gateway가 엔진을 찾는지
        run: bash e2e/engine-ip-change.sh

      - name: 회로 차단기 열림·닫힘 (finesse-api → 엔진)
        run: bash e2e/circuit-breaker.sh

      - name: 상태와 로그
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 80

