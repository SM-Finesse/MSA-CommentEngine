name: build-test

# 슬롯(api) · 본체(comment-engine, gateway) · tetris 칩의 서비스(chips/tetris)의 빌드와 시험. PR과 main 푸시에서 돈다.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: test
        # --continue: 한 모듈 시험이 실패해도 나머지 모듈 시험까지 돌려서 전체 결과를 본다
        run: bash ./gradlew test --continue --console=plain

      - name: 시험 수 세기
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          # 수는 testcase로 센다. 다시 돌린 시험(build.gradle의 test-retry)은 묶음의 tests/failures 속성에 시도마다 잡혀서,
          # 속성으로 세면 결국 통과한 시험도 실패로 보인다
          total = fail = skip = flaky = 0
          notes = []
          for f in sorted(glob.glob('**/build/test-results/test/*.xml', recursive=True)):
              r = ET.parse(f).getroot()
              t = b = s = 0
              for case in r.iter('testcase'):
                  t += 1
                  name = f"{case.get('classname')} > {case.get('name')}"
                  bad = list(case.findall('failure')) + list(case.findall('error'))
                  again = list(case.findall('flakyFailure')) + list(case.findall('flakyError'))
                  if bad:
                      b += 1
                      msg = (bad[0].get('message') or '').strip().replace('\n', ' | ')
                      notes.append(f"FAILED {name}: {msg[:600]}")
                  elif case.find('skipped') is not None:
                      s += 1
                  elif again:
                      # 실패했다가 다시 돌려서 통과 — 통과로 치지만 숨기지 않는다
                      flaky += 1
                      msg = (again[0].get('message') or '').strip().replace('\n', ' | ')
                      notes.append(f"FLAKY {name}: {len(again)}번 실패 후 통과: {msg[:300]}")
              total += t; fail += b; skip += s
              print(f"{r.get('name')}: tests={t} failed={b} skipped={s}")
          print(f"TOTAL tests={total} failed={fail} skipped={skip} flaky={flaky}")
          for line in notes:
              print(line)
          PY

      - name: 시험 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

  compose:
    # jar를 만들고 docker compose로 본체와 tetris 칩(.env 의 COMPOSE_FILE)을 띄운 뒤 gateway(8080)를 거쳐 불러 본다
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: jar 만들기
        run: bash ./gradlew build -x test --console=plain

      - name: 띄우기
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: gateway 경유 호출
        run: |
          set -e
          call() { echo "== $1"; shift; curl -sS -f -w '\n[HTTP %{http_code}]\n' "$@"; }
          call "팩 목록" http://localhost:8080/v1/domains | tee /tmp/domains.txt
          grep -q '"id":"demo"' /tmp/domains.txt
          grep -q '"id":"tetris"' /tmp/domains.txt
          call "demo 칩 (template)" -H 'Content-Type: application/json' http://localhost:8080/v1/comments/light \
            -d '{"domain":"demo","items":[{"metric":"metric_a","value":0.31,"zone":"high"}],"deadline_ms":35000}' | tee /tmp/demo.txt
          grep -q '"fallback":false' /tmp/demo.txt
          call "tetris 칩 (server, small-gen)" -H 'Content-Type: application/json' http://localhost:8080/v1/comments/light \
            -d '{"domain":"tetris","items":[{"metric":"delta_app","value":0.05,"zone":"high"}],"deadline_ms":35000}' | tee /tmp/tetris.txt
          grep -q 'small-gen' /tmp/tetris.txt
          call "finesse-api 경유 demo 칩" -H 'Content-Type: application/json' http://localhost:8080/api/v1/comment-demo/light \
            -d '{"domain":"demo","highlights":[{"stat":"metric_a","value":0.31,"zone":"high"}]}' | tee /tmp/api-demo.txt
          grep -q '"light_summary":"A가 높습니다."' /tmp/api-demo.txt
          call "finesse-api 경유 tetris 칩" -H 'Content-Type: application/json' http://localhost:8080/api/v1/comment-demo/light \
            -d '{"domain":"tetris","highlights":[{"stat":"delta_app","value":0.05,"zone":"high"}]}' | tee /tmp/api-tetris.txt
          grep -q 'small-gen:9200' /tmp/api-tetris.txt
          echo "== finesse-api 경유 통계 (tetris-analytics 응답을 그대로). 틀린 유저명이라 TETR.IO는 부르지 않음"
          code=$(curl -s -o /tmp/stats.txt -w '%{http_code}' http://localhost:8080/api/v1/stats/a); cat /tmp/stats.txt; echo " [HTTP $code]"
          test "$code" = "400"
          grep -q '"error_code":"INVALID_USERNAME"' /tmp/stats.txt
          echo "== finesse-api 경유 light (stats 에러를 그대로, scope 검사)"
          code=$(curl -s -o /tmp/light.txt -w '%{http_code}' 'http://localhost:8080/api/v1/comment/a?scope=light'); cat /tmp/light.txt; echo " [HTTP $code]"
          test "$code" = "400"
          grep -q '"error_code":"INVALID_USERNAME"' /tmp/light.txt
          code=$(curl -s -o /tmp/light.txt -w '%{http_code}' 'http://localhost:8080/api/v1/comment/abc?scope=nope'); cat /tmp/light.txt; echo " [HTTP $code]"
          test "$code" = "400"
          grep -q 'scope는 light 또는 heavy만 허용됩니다: nope' /tmp/light.txt
          echo "== finesse-api 경유 heavy: SSE가 gateway를 지나는지 (틀린 유저명이라 TETR.IO는 부르지 않음. start → error)"
          curl -sS -N --max-time 30 -D /tmp/heavy.headers -o /tmp/heavy.txt 'http://localhost:8080/api/v1/comment/a?scope=heavy'
          cat /tmp/heavy.headers /tmp/heavy.txt
          grep -qi '^content-type: text/event-stream' /tmp/heavy.headers
          grep -q '^event:start' /tmp/heavy.txt
          grep -q '"total_chapters":8' /tmp/heavy.txt
          grep -q '^event:error' /tmp/heavy.txt
          grep -q '"error_code":"INVALID_USERNAME"' /tmp/heavy.txt
          echo "== 화면(frontend 컨테이너): 첫 화면과, 화면의 /api 가 gateway를 거쳐 칩으로 가는지"
          curl -sS -f -o /tmp/index.html http://localhost:8088/
          grep -qi '<div id="root"' /tmp/index.html
          code=$(curl -s -o /tmp/front-stats.txt -w '%{http_code}' http://localhost:8088/api/v1/stats/a); cat /tmp/front-stats.txt; echo " [HTTP $code]"
          test "$code" = "400"
          grep -q '"error_code":"INVALID_USERNAME"' /tmp/front-stats.txt
          curl -sS -N --max-time 30 -o /tmp/front-heavy.txt 'http://localhost:8088/api/v1/comment/a?scope=heavy'
          grep -q '^event:start' /tmp/front-heavy.txt
          grep -q '^event:error' /tmp/front-heavy.txt
          echo "== 서비스 선택 화면(select-screen): 첫 화면과 칩 목록 설정"
          curl -sS -f -o /tmp/select.html http://localhost:8090/
          grep -q 'id="chips"' /tmp/select.html
          curl -sS -f http://localhost:8090/config.json | grep -q '"chips"'
          echo "== 칩 화면 → 서비스 선택 화면: 푸터 로고 스크립트와 /engine/"
          curl -sS -f http://localhost:8088/ | grep -q 'src="/engine-logo.js"'
          curl -sS -f http://localhost:8088/ | grep -q 'window.CE_ENGINE_HOME="http://{host}:8090"'
          curl -sS -f -o /dev/null http://localhost:8088/engine-logo.js
          curl -sS -f http://localhost:8088/engine/ | grep -q 'id="chips"'
          echo "== 규칙 밖 경로는 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = "404"

      - name: 추적 확인 (Zipkin)
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request
          # 경로마다 한 추적에 이 서비스들만 정확히 나와야 한다
          want = {
              "gateway → comment-engine": {"gateway", "comment-engine"},
              "gateway → finesse-api → comment-engine": {"gateway", "finesse-api", "comment-engine"},
              "gateway → finesse-api → tetris-analytics": {"gateway", "finesse-api", "tetris-analytics"},
          }
          found, last = {}, None
          for _ in range(20):
              try:
                  traces = json.load(urllib.request.urlopen("http://localhost:9411/api/v2/traces?serviceName=gateway&limit=100"))
              except Exception as e:
                  traces, last = [], e
              for t in traces:
                  names = {s.get("localEndpoint", {}).get("serviceName") for s in t} - {None}
                  for label, services in want.items():
                      if label not in found and names == services:
                          found[label] = f"trace {t[0]['traceId']} spans={len(t)}"
              if len(found) == len(want):
                  for label in want:
                      print(f"OK: {label}: {found[label]}")
                  sys.exit(0)
              time.sleep(3)
          print("추적에 안 나온 경로:", [label for label in want if label not in found], last)
          print(urllib.request.urlopen("http://localhost:9411/api/v2/services").read().decode())
          sys.exit(1)
          PY

      - name: gateway 헬스에 하위 서비스 상태
        run: bash e2e/gateway-health.sh

      - name: 통계 넘기기 (finesse-api → tetris-analytics)
        run: bash e2e/stats-relay.sh

      - name: 칩 꽂기·뽑기 (폴더 하나로, 자기 서비스를 가진 칩)
        run: bash e2e/plug-test.sh

      - name: 엔진 IP가 바뀌어도 gateway가 엔진을 찾는지
        run: bash e2e/engine-ip-change.sh

      - name: 회로 차단기 열림·닫힘 (finesse-api → 엔진)
        run: bash e2e/circuit-breaker.sh

      - name: 상태와 로그
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 80

