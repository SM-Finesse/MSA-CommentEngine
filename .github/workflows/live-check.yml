# 실제 TETR.IO로 새 구조를 한 바퀴 돌려 본다 (e2e/live-check.sh)
#   통계 → light(small-gen 문장) → 추적이 한 줄로 이어지는지 → heavy SSE(8챕터) → small-gen을 멈췄을 때 (light 대체 문장, heavy failed)
#
# 실제 TETR.IO를 부르므로 PR마다 돌리지 않는다. 손으로 돌리거나(Actions 탭 → live-check → Run workflow),
# 이 확인 도구 자체를 고친 PR에서만 돈다. 결과는 작업 요약에 남는다.
name: live-check

on:
  workflow_dispatch:
    inputs:
      username:
        description: "TETR.IO 유저명"
        default: "5han"
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-check.yml'
      - 'e2e/live-check.sh'

permissions:
  contents: read

concurrency:
  group: tetrio-live   # compare-monolith와 겹치지 않게 (TETR.IO 호출)
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: jar 만들기
        run: bash ./gradlew build -x test --console=plain

      - name: 띄우기
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: 한 바퀴
        run: bash e2e/live-check.sh "${{ inputs.username || '5han' }}"

      - name: 기록
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 40 finesse-api comment-engine tetris-analytics || true
          docker compose down -v || true
